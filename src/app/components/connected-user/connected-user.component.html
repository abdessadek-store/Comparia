<div class="container mt-3">
  <form class="d-flex align-items-center gap-3 flex-wrap justify-content-start custom-form">

    <div class="form-group">
      <label class="form-label mb-0 me-2">Nom :</label>
      <input type="text" class="form-control form-control-sm rounded-pill" [(ngModel)]="user.lastName" name="lastName" placeholder="Nom">
    </div>

    <div class="form-group">
      <label class="form-label mb-0 me-2">Telephone :</label>
      <input type="tel" class="form-control form-control-sm rounded-pill" [(ngModel)]="user.telephone" name="email" placeholder="06....">
    </div>

     <div class="form-group">
      <label class="form-label mb-0 me-2">Email :</label>
      <input type="email" class="form-control form-control-sm rounded-pill" [(ngModel)]="user.email" name="email" placeholder="@Email">
    </div>

     <div class="form-group">
      <label class="form-label mb-0 me-2">Ville :</label>
      <input type="text" class="form-control form-control-sm rounded-pill" [(ngModel)]="user.ville" name="email" placeholder="ville">
    </div>

    <div class="form-group">
      <label class="form-label mb-0 me-2">Budget :</label>
      <input type="number" class="form-control form-control-sm rounded-pill" [(ngModel)]="user.budget" name="email" placeholder="budget">
    </div>

     <div class="form-group">
      <label class="form-label mb-0 me-2">Apport :</label>
      <input type="number" class="form-control form-control-sm rounded-pill" [(ngModel)]="user.budget" name="email" placeholder="budget">
    </div>

    <!-- <button class="btn btn-sm btn-primary rounded-pill">Enregistrer</button> -->
  </form>
</div>
