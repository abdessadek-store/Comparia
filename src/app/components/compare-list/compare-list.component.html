<div class="table-responsive">
        <table mat-table [dataSource]="filteredPrices" class="mat-elevation-z4 table table-hover rounded-3 overflow-hidden">
          <!-- Bank Column -->
          <ng-container matColumnDef="bank">
            <th mat-header-cell *matHeaderCellDef class="bg-light">Banque</th>
            <td mat-cell *matCellDef="let element">
              <app-bank-card [bank]="element.bank"></app-bank-card>
              <!-- {{ element.bank }} -->
            </td>
          </ng-container>

          <!-- taux Column -->
          <ng-container matColumnDef="taux">
            <th mat-header-cell *matHeaderCellDef class="bg-light">Taux</th>
            <td mat-cell *matCellDef="let element">{{ element.taux}}%</td>
          </ng-container>

          <!-- valeur Column -->
          <ng-container matColumnDef="valeur">
            <th mat-header-cell *matHeaderCellDef class="bg-light">Valeur</th>
            <td mat-cell *matCellDef="let element">{{ element.valeur | currency:'MAD':'symbol' }}</td>
          </ng-container>

          <!-- interet Column -->
          <ng-container matColumnDef="interet">
            <th mat-header-cell *matHeaderCellDef class="bg-light">Interet</th>
            <td mat-cell *matCellDef="let element">{{ element.interet | currency:'MAD':'symbol' }}</td>
          </ng-container>

          <!-- total Column -->
          <ng-container matColumnDef="total">
            <th mat-header-cell *matHeaderCellDef class="bg-light">Total à rembourser </th>
            <td mat-cell *matCellDef="let element">{{ element.total | currency:'MAD':'symbol' }}</td>
          </ng-container>

          <!-- CoutAssurance Column -->
          <ng-container matColumnDef="CoutAssurance">
            <th mat-header-cell *matHeaderCellDef class="bg-light">Cout Assurance</th>
            <td mat-cell *matCellDef="let element">{{ element.CoutAssurance | currency:'MAD':'symbol' }}</td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </div>
